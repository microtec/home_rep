; Configurazione Zonico - Firebird 2.5
; Copiare questo file accanto a Zonico.exe (deve chiamarsi Zonico.ini).

[DATABASE]
; Indirizzo IP (o nome host) del server Firebird
IndirizzoIP=127.0.0.1
; Porta del servizio Firebird
Port=3050
; Alias del database definito in aliases.conf sul server
; (es. in aliases.conf: ZONICO = C:\Zonico\ZONICO.FDB)
Alias=ZONICO
; Percorso completo del file .FDB, usato solo se Alias e' vuoto
Percorso=C:\Zonico\ZONICO.FDB
; Credenziali di accesso al database
User_Name=SYSDBA
Password=masterkey
; TCPIP per server Firebird, Local per database embedded/locale
Protocol=TCPIP
; Deve corrispondere al character set del database (lo script lo crea in UTF8)
CharacterSet=UTF8
; Client Firebird 2.5 da caricare (fbclient.dll a 32 bit);
; se vuoto viene cercato nel PATH o accanto all'eseguibile
VendorLib=
